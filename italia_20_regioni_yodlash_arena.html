<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#687386;--accent:#1d7a55;--bad:#c53b4d;--line:#e6e9ef}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#f8faf9,#eef3f0);color:var(--ink)}
header{padding:24px 16px 14px;text-align:center}h1{margin:0;font-size:clamp(25px,5vw,42px)}.sub{color:var(--muted);margin:8px auto 0;max-width:720px}
.wrap{max-width:1100px;margin:auto;padding:12px 14px 40px}.games{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:12px 0 18px}
.game{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px #00000009}.game.active{background:var(--accent);color:#fff;border-color:var(--accent)}.game small{display:block;font-weight:500;opacity:.8;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 35px #0000000b}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title{font-size:22px;font-weight:800}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#f0f3f6;border-radius:999px;padding:7px 11px;font-size:14px}
.prompt{font-size:25px;font-weight:800;text-align:center;margin:15px 0 10px}.feedback{min-height:28px;text-align:center;font-weight:700;margin:7px}.good{color:var(--accent)}.bad{color:var(--bad)}
.mapbox{position:relative;max-width:820px;margin:8px auto;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line)}.mapbox img{display:block;width:100%;height:auto}
.hot{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:transparent;cursor:pointer}.hot:hover{background:#ffffff55;border-color:#1d7a55}
.citydot{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:#1d7a55;box-shadow:0 2px 8px #0005;cursor:pointer}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}button,select{font:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:650px;margin:12px auto}.choice{padding:15px;border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:700}.choice:hover{border-color:#1d7a55;background:#f5fbf8}.choice.correct{border-color:var(--accent);background:#eaf7f0}.choice.wrong{border-color:var(--bad);background:#fff0f2}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:800px;margin:14px auto}.matchcol{display:grid;gap:8px}.match button{text-align:left}.match button.sel{outline:3px solid #d6eadf;background:#f2faf5}
.scorebig{font-size:42px;font-weight:900;text-align:center;margin:12px}.bar{height:10px;background:#edf0f3;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);width:100%}
@media(max-width:720px){.games{grid-template-columns:repeat(2,1fr)}.games .game:last-child{grid-column:span 2}.choices{grid-template-columns:1fr}.match{grid-template-columns:1fr}.hot{width:52px;height:52px}}
</style>

const names=regions.map(r=>r.name), capitals=regions.map(r=>r.capital);
let score=0,streak=0,answered=0,current=null,speedTimer=null,speedEnd=0,speedRunning=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function setHeader(t){document.getElementById('gameTitle').textContent=t}
function stats(){document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;document.getElementById('progress').textContent=Math.min(answered,20)+"/20"}
function feedback(ok,msg){let f=document.getElementById('feedback');if(f){f.textContent=msg;f.className='feedback '+(ok?'good':'bad')}}
function result(ok){if(ok){score+=10+Math.min(streak,5);streak++;answered++}else{streak=0;score=Math.max(0,score-2)}stats()}
function mapHTML(){return '<div class="mapbox"><img src="'+img+'" alt="Italy map">'+regions.map((r,i)=>'<button class="hot" style="left:'+r.x+'%;top:'+r.y+'%" data-i="'+i+'" aria-label="'+r.name+'"></button>').join('')+'</div>'}
function startMap(){
 setHeader('1. Xaritadan top');current=shuffle(regions)[0];
 document.getElementById('gameArea').innerHTML='<div class="prompt">🗺️ “'+current.uz+'”ni xaritadan toping!</div><div id="feedback" class="feedback">Xaritadagi tegishli hududni bosing.</div>'+mapHTML()+'<div class="controls"><button class="primary" onclick="startMap()">↻ Yangi savol</button></div>';
 document.querySelectorAll('.hot').forEach(b=>b.onclick=()=>{let r=regions[+b.dataset.i],ok=r.name===current.name;result(ok);feedback(ok,'✅ To‘g‘ri! '+r.capital+' — '+r.uz+' poytaxti.','❌ Bu '+r.uz+'. To‘g‘ri joyni yana toping.');if(ok)setTimeout(startMap,700)})
}
function startCapital(){
 setHeader('2. Poytaxtni top');current=shuffle(regions)[0];
 let opts=shuffle([current.capital,...shuffle(capitals.filter(x=>x!==current.capital)).slice(0,3)]);
 document.getElementById('gameArea').innerHTML='<div class="prompt">🏛️ '+current.uz+' viloyatining poytaxti qaysi?</div><div id="feedback" class="feedback"></div><div class="choices">'+opts.map(x=>'<button class="choice" data-cap="'+x+'">'+x+'</button>').join('')+'</div><div class="controls"><button onclick="startCapital()">↻ Boshqa savol</button></div>';
 document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let ok=b.dataset.cap===current.capital;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');result(ok);feedback(ok,'🎉 To‘g‘ri! '+current.name+' → '+current.capital,'❌ To‘g‘ri javob: '+current.capital);if(ok)setTimeout(startCapital,700)})
}
function startMatch(){
 setHeader('3. Juftini top');let set=shuffle(regions).slice(0,6),left=shuffle(set),right=shuffle(set),l=null,r=null,matched=0;
 document.getElementById('gameArea').innerHTML='<div class="prompt">🔗 Har bir regionni o‘z poytaxti bilan juftlang</div><div id="feedback" class="feedback"></div><div class="match"><div class="matchcol" id="left">'+left.map(x=>'<button data-name="'+x.name+'">🇮🇹 '+x.uz+'</button>').join('')+'</div><div class="matchcol" id="right">'+right.map(x=>'<button data-cap="'+x.capital+'">🏛️ '+x.capital+'</button>').join('')+'</div></div><div class="controls"><button onclick="startMatch()">↻ Qayta aralashtir</button></div>';
 function check(){if(!l||!r)return;let ok=regions.find(x=>x.name===l).capital===r;result(ok);feedback(ok,'✅ Zo‘r juftlik!','❌ Bu juftlik mos emas.');if(ok){document.querySelector('#left button[data-name="'+l+'"]').disabled=true;document.querySelector('#right button[data-cap="'+r+'"]').disabled=true;matched++;if(matched===set.length)setTimeout(()=>{feedback(true,'🏆 6/6 — Ajoyib! Yana bir raund!');setTimeout(startMatch,900)},500)}l=null;r=null}
 document.querySelectorAll('#left button').forEach(b=>b.onclick=()=>{l=b.dataset.name;document.querySelectorAll('#left button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');check()});
 document.querySelectorAll('#right button').forEach(b=>b.onclick=()=>{r=b.dataset.cap;document.querySelectorAll('#right button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');check()})
}
function startCity(){
 setHeader('4. Shaharni top');current=shuffle(regions)[0];
 document.getElementById('gameArea').innerHTML='<div class="prompt">📍 “'+current.capital+'” shahrini xaritadan toping!</div><div id="feedback" class="feedback">Yashil nuqtalardan poytaxtni tanlang.</div><div class="mapbox"><img src="'+img+'" alt="Italy map">'+regions.map((r,i)=>'<button class="citydot" style="left:'+r.cx+'%;top:'+r.cy+'%" data-i="'+i+'" aria-label="'+r.capital+'"></button>').join('')+'</div><div class="controls"><button onclick="startCity()">↻ Yangi shahar</button></div>';
 document.querySelectorAll('.citydot').forEach(b=>b.onclick=()=>{let r=regions[+b.dataset.i],ok=r.capital===current.capital;result(ok);feedback(ok,'🎯 To‘g‘ri! '+current.capital+' — '+current.uz,'❌ Bu '+r.capital+'. Yana urinib ko‘ring.');if(ok)setTimeout(startCity,700)})
}
function startSpeed(){
 setHeader('5. 60 soniyalik challenge');speedRunning=false;clearInterval(speedTimer);
 document.getElementById('gameArea').innerHTML='<div class="scorebig"><span id="timer">60</span> s</div><div class="bar"><i id="timerbar"></i></div><div class="prompt">⚡ 60 soniyada imkon qadar ko‘p savol!</div><div id="feedback" class="feedback">“Boshlash”ni bosing.</div><div id="speedQuestion" class="choices"></div><div class="controls"><button class="primary" onclick="runSpeed()">▶ Boshlash</button></div>'
}
function runSpeed(){
 if(speedRunning)return;speedRunning=true;score=0;streak=0;answered=0;stats();speedEnd=Date.now()+60000;nextSpeed();
 speedTimer=setInterval(()=>{let s=Math.max(0,Math.ceil((speedEnd-Date.now())/1000));document.getElementById('timer').textContent=s;document.getElementById('timerbar').style.width=(s/60*100)+'%';if(s<=0){clearInterval(speedTimer);speedRunning=false;document.getElementById('speedQuestion').innerHTML='';feedback(true,'🏁 Vaqt tugadi! Ball: '+score+' | To‘g‘ri: '+answered)}},200)
}
function nextSpeed(){
 if(!speedRunning)return;current=shuffle(regions)[0];let askCap=Math.random()<.5;
 let opts=shuffle(askCap?[current.capital,...shuffle(capitals.filter(x=>x!==current.capital)).slice(0,3)]:[current.uz,...shuffle(regions.filter(x=>x.name!==current.name)).slice(0,3).map(x=>x.uz)]);
 document.getElementById('speedQuestion').innerHTML='<div class="prompt" style="grid-column:1/-1">'+(askCap?'🏛️ '+current.uz+' → ?':'🗺️ '+current.capital+' qaysi region poytaxti?')+'</div>'+opts.map(x=>'<button class="choice">'+x+'</button>').join('');
 document.querySelectorAll('#speedQuestion .choice').forEach(b=>b.onclick=()=>{let ok=askCap?b.textContent===current.capital:b.textContent===current.uz;result(ok);feedback(ok,'✅','❌ '+(askCap?current.capital:current.uz));if(Date.now()<speedEnd)setTimeout(nextSpeed,130)})
}
document.querySelectorAll('.game').forEach(b=>b.onclick=()=>{document.querySelectorAll('.game').forEach(x=>x.classList.remove('active'));b.classList.add('active');let g=b.dataset.game;if(g==='map')startMap();if(g==='capital')startCapital();if(g==='match')startMatch();if(g==='city')startCity();if(g==='speed')startSpeed()});
startMap();stats();
</script>
</body></html>
